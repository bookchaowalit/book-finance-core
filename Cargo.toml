[package]
name = "book-finance-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Pure typed finance kernel for the Book Finance platform"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
