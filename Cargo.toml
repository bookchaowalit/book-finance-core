[package]
name = "book-finance-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Pure typed finance kernel for the Book Finance platform"
license = "MIT"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# arbitrary_precision keeps JSON number literals as text so money amounts never
# pass through f64 before fixed-point parsing.
serde_json = { version = "1.0", features = ["arbitrary_precision"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
